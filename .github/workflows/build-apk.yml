name: Build TitanX APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TitanX-Game-Studio-Android-Build-v0.1.1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack TitanX source
        run: |
          unzip -q TitanX-Game-Studio-Android-Build-v0.1.1.zip -d android-src
          test -f android-src/app/build.gradle
          test -f android-src/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses and install SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -f "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          gradle --no-daemon -p android-src assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanX-Game-Studio-APK
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
